[project]
name = "make-magic-pipeline"
version = "0.1.0"
description = "Lightweight normalized data layer + pipeline for make-magic (DuckDB medallion lake + Pydantic edge contracts). Additive to the Airtable source-of-truth workflow; never degrades it."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "lxml>=5",
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Airtable adapter (pull-only in the pilot; derived write-back in P5).
airtable = ["pyairtable>=3.0"]
# `typer` is a TEST-only dep: it lets tests import the standalone PEP-723
# `scripts/deck_factsheet.py` edge (its offline `factsheet_from_deck` entry point)
# in the pipeline venv. Not a runtime dependency of the pipeline package.
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1", "typer>=0.12"]

[tool.uv]
# Match the existing plugin scripts' reproducibility pin.
exclude-newer = "2026-06-08T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests hit the real Airtable base + Scryfall (creds required); deselected
# by default so the normal suite stays offline + fast. Run with creds sourced:
#   set -a && . ../.env && set +a && uv run --extra dev pytest -m live -q
addopts = "-m 'not live'"
markers = ["live: end-to-end test against the real Airtable base (needs AIRTABLE_API_KEY; read-only)"]

# --- Style (rae-style python-styleguide: Pydantic-AI conventions) ---
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["pipeline"]

name: Deploy website

# Publishes website/ to Cloudflare Pages. Runs ONLY when website/** changes.
# - push to main  -> production deploy (make-magic.org)
# - pull_request  -> preview deploy at a unique Cloudflare URL, linked on the PR
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
# The first production deploy must come from main so Cloudflare sets the
# project's production branch to main.

on:
  push:
    branches: [main]
    paths: ['website/**']
  pull_request:
    paths: ['website/**']

# Cancel superseded runs for the same branch; keep separate prod/preview lanes.
concurrency:
  group: deploy-website-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  deploy:
    name: build + deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the preview URL on the PR
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deploy
        # Skips (rather than fails) until the CF secrets are configured, so a PR
        # that touches website/ stays green before setup is complete.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: >-
            pages deploy dist
            --project-name=make-magic
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- cf-pages-preview -->';
            const body = `${marker}\n🔮 **Website preview deployed:** ${url}\n\n_Updates on every push to this PR that touches \`website/\`._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

name: CI

# Offline gate for the make-magic pipeline, wired through the one check spine.
# The `check` job runs `./scripts/check` (ruff lint + format, pyright, the 690+
# offline test suite, the agent-file markdown lint, then the context linter);
# `scripts/check` self-cds into plugins/make-magic/pipeline, so there is no
# working-directory default here. The `live` (real Airtable/Scryfall) and
# `forge`/`xmage` (real JVM) markers are deselected by the package's pytest
# addopts, so nothing here needs network access or a provisioned Forge/JRE.
#
# `pr-body` validates the pull request body on PR events only. `repro` runs the
# pinned reproducibility suite as a pre-merge gate, but ONLY on a `release/*` PR
# (skipped — so a free pass — on every other PR). `ci-ok` fans in over all three
# and is the single required status: it passes when every needed job is success or
# skipped and fails on any failure or cancellation, so a skipped `repro` is a pass.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  check:
    name: lint + types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check
        run: ./scripts/check

  pr-body:
    name: PR body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate PR body
        run: python3 scripts/check_pr.py --event "$GITHUB_EVENT_PATH"

  repro:
    name: repro
    # Pre-merge regression gate, release-PR only. `head_ref` is set on PR events and
    # empty on push, so this is skipped on pushes and on any non-`release/*` PR —
    # skipped counts as a pass in ci-ok, so it is a no-op (zero cost) there and a
    # required gate on a `release/*` PR. Honors repro's "INFREQUENT by design" intent.
    if: startsWith(github.head_ref, 'release/')
    uses: ./.github/workflows/make-magic-repro.yml

  ci-ok:
    name: ci-ok
    needs: [check, pr-body, repro]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to pass or skip
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            echo "ci-ok: $result"
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
